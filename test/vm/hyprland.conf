# Hyprland config for the test VM. Reproduces the DP-9/DP-10 desk on the two
# bochs heads, including the ROTATION, so the transform code path is exercised
# rather than assumed:
#
#   Virtual-1  2560x1440, declared 600x340mm            -> 4.2353 px/mm  (DP-9)
#   Virtual-2  1920x1080 rotated 270 => logical 1080x1920,
#              declared 530x300mm native => 300x530 on the desk
#                                                        -> 3.6226 px/mm  (DP-10)
#
# y = -240 centres them on one horizon: (1440 - 1920) / 2. This is exactly the
# geometry tests/test_model.cpp asserts, so the numbers are predicted in advance.
#
# The plugin is NOT autoloaded — load it by hand after boot.

monitor = Virtual-1, 2560x1440@60, 0x0,       1
monitor = Virtual-2, 1920x1080@60, 2560x-240, 1, transform, 3

exec-once =

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Must stay 0 — see ROADMAP.md, "cursor:hotspot_padding must be 0".
cursor { hotspot_padding = 0 }

animations { enabled = false }
decoration { blur { enabled = false } }

debug {
    disable_logs = false
    enable_stdout_logs = true
}

plugin {
    mmcursor {
        enabled = true
        sensitivity = 1.0
        align = center
        gap_mm = 0

        # bochs reports a bogus 320x200mm for both heads, so the override path is
        # mandatory. Sizes are NATIVE orientation; rotation is applied for us.
        mmcursor-monitor = Virtual-1, 600, 340, 0
        mmcursor-monitor = Virtual-2, 530, 300, 0
    }
}
