# Config for testing mmcursor in a nested Hyprland.
#
#   Hyprland -c test/nested.conf
#
# Deliberately does NOT autoload the plugin. A crash-on-init plugin listed in a
# config means the compositor dies at startup, and if that config is your real
# one you are recovering from a TTY. Load it by hand instead:
#
#   hyprctl -i <nested-signature> plugin load $PWD/build/mmcursor.so
#   hyprctl -i <nested-signature> mmcursor
#
# ---------------------------------------------------------------------------
# On backends: a nested Hyprland uses the WAYLAND backend and its first output is
# WL-1. A truly headless Hyprland is NOT possible — CHeadlessBackend::drmFD()
# returns -1 and the allocator is taken from a started backend's DRM fd, so
# headless-only dies with "Cannot open backend: no allocator available". It needs
# either a real GPU seat or a parent compositor. See PLAN.md Phase 4.
#
# Rules for both output names are given, so this also works inside a VM where you
# add outputs by hand.
# ---------------------------------------------------------------------------
#
# The geometry reproduces the DP-9/DP-10 desk exactly as tests/test_model.cpp
# asserts it:
#
#   2560x1440 declared 600x340mm -> 4.2353 px/mm   (stands in for DP-9)
#   1080x1920 declared 300x530mm -> 3.6226 px/mm   (stands in for DP-10)
#
# The second sits at y = -240 so the two are physically centred on one horizon:
# (1440 - 1920) / 2 = -240. Stock behaviour is 28.75mm off at the top edge.

monitor = WL-1,       2560x1440@60, 0x0,       1
monitor = HEADLESS-2, 1080x1920@60, 2560x-240, 1

# If the nest only gives you one output, add the second at runtime:
#   hyprctl -i <sig> output create headless
# It comes up as HEADLESS-2 and picks up the rule above.

exec-once =

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Must stay 0. This is the one stock setting that interacts with the mm
# accumulator: it holds the cursor N logical px inside the layout while our mm
# clamp stops at the true panel edge, reintroducing up to N px of dead travel at
# edges. The plugin warns if you change it. tests/test_apply.cpp pins the bound.
cursor {
    hotspot_padding = 0
}

# Off, so nothing animates the cursor or the layout while you are measuring.
animations { enabled = false }
decoration { blur { enabled = false } }

# Escape hatch. You are hooking the input path, so the plausible failure mode is
# "compositor alive, cursor unusable" — keep a keyboard-only way out.
$mod = SUPER
bind = $mod SHIFT, E, exit

debug {
    disable_logs = false
    enable_stdout_logs = true
}

plugin {
    mmcursor {
        enabled = true
        sensitivity = 1.0
        align = center
        gap_mm = 0

        # Headless outputs always report physical size 0x0, and a wayland-backend
        # output has no EDID either, so the override path is mandatory here —
        # which is exactly the situation it exists for.
        mmcursor-monitor = WL-1,       600, 340, 0
        mmcursor-monitor = HEADLESS-2, 300, 530, 0
    }
}
